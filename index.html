<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>ジャグラー実戦カウンター Pro</title>
<style>
:root{--navy:#17324d;--blue:#2f75b5;--green:#68ad43;--orange:#e98655;--red:#c65d5d;--gray:#8ea1b2;--bg:#f3f6f9;--card:#fff;--text:#17324d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
.wrap{max-width:560px;margin:auto;padding:12px 12px 36px}
h1{font-size:23px;margin:4px 4px 12px}
h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 3px 16px #17324d12}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}
label{font-size:12px;font-weight:800;display:block;margin:0 0 5px}
input,select{width:100%;border:2px solid #d5dce3;border-radius:15px;padding:14px 12px;font-size:18px;background:#fff;color:var(--text);min-height:54px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#eef5fc;border-radius:16px;padding:13px;text-align:center}
.kpi:nth-child(2){background:#f8f8f8}
.kpi b{display:block;font-size:27px;margin-top:2px}
.kpi span{font-size:12px;font-weight:800}
.counter{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:8px}
.counter .num{text-align:center;font-size:40px;font-weight:900;line-height:1}
.btn{border:0;border-radius:16px;min-height:66px;font-size:36px;font-weight:900;color:#fff;touch-action:manipulation}
.minus{background:var(--gray)} .grape{background:var(--green)} .cherry{background:var(--orange)} .big{background:#347dbd}.reg{background:var(--red)}
.smallbtn{border:0;border-radius:13px;min-height:46px;padding:0 13px;font-weight:800;background:#e9eef3;color:var(--navy)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.quick .smallbtn{font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f7f9fb;border-radius:14px;padding:10px}.stat b{display:block;font-size:20px}.stat small{font-weight:700;color:#647789}
.expect{border-radius:16px;padding:14px;background:#f7f9fb;border-left:7px solid var(--gray)}
.expect strong{font-size:22px}.expect p{margin:5px 0 0;font-size:12px;line-height:1.55}
.bar{height:10px;background:#e7edf2;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--blue);width:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:50px;border:0;border-radius:14px;font-weight:800;background:#e9eef3;color:var(--navy)}
details{margin-top:8px}.history{max-height:260px;overflow:auto}.row{padding:9px 0;border-bottom:1px solid #e5ebf0;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.note{font-size:11px;color:#6d7e8e;line-height:1.55}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17324d;color:white;padding:11px 16px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}
@media(max-width:380px){.counter{grid-template-columns:62px 1fr 62px}.btn{font-size:30px}.quick{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎰 ジャグラー実戦カウンター Pro</h1>

<section class="card">
  <div class="grid2">
    <div><label>機種</label><select id="machine"></select></div>
    <div><label>現在G</label><input id="g" type="number" inputmode="numeric" min="0" value="0"></div>
  </div>
  <div class="quick">
    <button class="smallbtn" data-g="1">G +1</button>
    <button class="smallbtn" data-g="10">G +10</button>
    <button class="smallbtn" data-g="50">G +50</button>
    <button class="smallbtn" data-g="100">G +100</button>
  </div>
</section>

<section class="card">
  <div class="kpis">
    <div class="kpi"><span>現在G</span><b id="kg">0G</b></div>
    <div class="kpi"><span>当たり合計</span><b id="hits">0回</b></div>
  </div>
</section>

<section class="card">
<h2>🍇 ぶどう</h2>
<div class="counter">
<button class="btn minus" data-counter="grape" data-d="-1">−</button><div class="num" id="grape">0</div><button class="btn grape" data-counter="grape" data-d="1">＋</button>
</div>
</section>

<section class="card">
<h2>🍒 チェリー</h2>
<div class="counter">
<button class="btn minus" data-counter="cherry" data-d="-1">−</button><div class="num" id="cherry">0</div><button class="btn cherry" data-counter="cherry" data-d="1">＋</button>
</div>
</section>

<section class="card">
<h2>🔵 BIG <span class="note">— 押すと現在Gを記録</span></h2>
<div class="counter">
<button class="btn minus" data-counter="big" data-d="-1">−</button><div class="num" id="big">0</div><button class="btn big" data-hit="big">＋</button>
</div>
</section>

<section class="card">
<h2>🔴 REG <span class="note">— 押すと現在Gを記録</span></h2>
<div class="counter">
<button class="btn minus" data-counter="reg" data-d="-1">−</button><div class="num" id="reg">0</div><button class="btn reg" data-hit="reg">＋</button>
</div>
</section>

<section class="card">
<h2>📊 自動判定</h2>
<div class="stats">
<div class="stat"><small>合算</small><b id="combined">—</b></div>
<div class="stat"><small>BIG確率</small><b id="bigRate">—</b></div>
<div class="stat"><small>REG確率</small><b id="regRate">—</b></div>
<div class="stat"><small>ぶどう</small><b id="grapeRate">—</b></div>
<div class="stat"><small>チェリー</small><b id="cherryRate">—</b></div>
<div class="stat"><small>1G当たり</small><b id="hitRate">—</b></div>
</div>
<div class="bar"><i id="scorebar"></i></div>
<div class="expect" id="expect"><strong>期待度：データ不足</strong><p>まず総回転とBIG/REGを入れると簡易判定します。</p></div>
</section>

<section class="card">
<h2>⏱️ 直近の当たり</h2>
<div class="stats">
<div class="stat"><small>前回から</small><b id="lastGap">—</b></div>
<div class="stat"><small>前回G</small><b id="lastHitG">—</b></div>
</div>
<div id="eventList" class="history"></div>
</section>

<section class="card">
<h2>💾 実戦データ</h2>
<div class="actions">
<button id="save">この実戦を保存</button>
<button id="reset">新しい実戦</button>
<button id="export">履歴を書き出す</button>
<button id="clear">履歴を全削除</button>
</div>
<details><summary>保存履歴を見る</summary><div id="history" class="history"></div></details>
<p class="note">データはこのiPhoneのブラウザ内に保存します。GitHub側には実戦データを送信しません。</p>
</section>
</div>
<div id="toast" class="toast"></div>

<script>
const profiles={
"ゴーゴージャグラー":{"b":1/259,"r":1/354,"c":1/149,"r6":1/234},
"マイジャグラー":{"b":1/273,"r":1/409,"c":1/168,"r6":1/229},
"ファンキージャグラー":{"b":1/266,"r":1/439,"c":1/165,"r6":1/219},
"ハッピージャグラー":{"b":1/273,"r":1/397,"c":1/161,"r6":1/225},
"ネオアイムジャグラー":{"b":1/273,"r":1/439,"c":1/168,"r6":1/250},
"ジャグラーガールズ":{"b":1/273,"r":1/364,"c":1/160,"r6":1/220},
"ミスタージャグラー":{"b":1/268,"r":1/374,"c":1/157,"r6":1/220}
};
const state={machine:"ゴーゴージャグラー",g:0,grape:0,cherry:0,big:0,reg:0,lastHitG:null,events:[]};
const $=id=>document.getElementById(id);
const machines=Object.keys(profiles);
machines.forEach(m=>{let o=document.createElement("option");o.value=m;o.textContent=m; $("machine").appendChild(o)});
$("machine").value=state.machine;

function rate(n,d){return n&&d?`1/${Math.round(d/n)}`:"—"}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1200)}
function saveLocal(){localStorage.setItem("jugglerPro",JSON.stringify(state))}
function render(){
 $("kg").textContent=state.g+"G"; $("g").value=state.g;
 ["grape","cherry","big","reg"].forEach(k=>$(k).textContent=state[k]);
 $("hits").textContent=(state.big+state.reg)+"回";
 $("combined").textContent=rate(state.big+state.reg,state.g);
 $("bigRate").textContent=rate(state.big,state.g);
 $("regRate").textContent=rate(state.reg,state.g);
 $("grapeRate").textContent=rate(state.grape,state.g);
 $("cherryRate").textContent=rate(state.cherry,state.g);
 $("hitRate").textContent=state.g?`1/${Math.round(state.g/(state.big+state.reg||1))}`:"—";
 if(state.lastHitG!==null){$("lastHitG").textContent=state.lastHitG+"G";$("lastGap").textContent=(state.g-state.lastHitG)+"G"}else{$("lastHitG").textContent="—";$("lastGap").textContent="—"}
 const p=profiles[state.machine];
 let score=0;
 if(state.g>=500){
   const comb=state.g/(state.big+state.reg||1);
   const rr=state.g/(state.reg||1);
   const bScore=Math.max(0,Math.min(100,(p.c*100)/Math.max(1,comb)*50));
   const rScore=Math.max(0,Math.min(100,(p.r*100)/Math.max(1,rr)*50));
   score=Math.round(bScore*.35+rScore*.65);
 }
 $("scorebar").style.width=score+"%";
 let label="期待度：データ不足",msg="総回転500G以上から簡易判定します。REGを重視し、合算も合わせて見ます。";
 if(state.g>=500){
   if(score>=78){label="期待度：🟢 高め";msg="REG・合算がかなり良好。高設定候補として追う価値あり。ただし単独で設定6確定ではありません。"}
   else if(score>=60){label="期待度：🟢 やや高め";msg="良い数値。ぶどうも併せて確認し、グラフ・店の傾向と合わせて判断。"}
   else if(score>=42){label="期待度：🟡 中間域";msg="まだブレる範囲。1000〜2000G以上までREGと合算の推移を見る。"}
   else {label="期待度：🔴 低め";msg="現時点では弱め。店の根拠がなければ台移動も候補。"}
 }
 $("expect").innerHTML=`<strong>${label}</strong><p>${msg}</p>`;
 $("eventList").innerHTML=state.events.slice().reverse().map(e=>`<div class="row"><span>${e.type==="big"?"🔵 BIG":"🔴 REG"} ${e.g}G</span><b>${e.gap==null?"—":"前回+"+e.gap+"G"}</b></div>`).join("");
}
function hit(type){
 const gap=state.lastHitG===null?null:state.g-state.lastHitG;
 state[type]++; state.lastHitG=state.g; state.events.push({type,g:state.g,gap});
 saveLocal();render();toast(type==="big"?"BIGを記録":"REGを記録");
}
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{state.g+=+b.dataset.g;saveLocal();render()});
$("g").oninput=()=>{state.g=Math.max(0,parseInt($("g").value||0));saveLocal();render()};
$("machine").onchange=()=>{state.machine=$("machine").value;saveLocal();render()};
document.querySelectorAll("[data-counter]").forEach(b=>b.onclick=()=>{
 const k=b.dataset.counter; state[k]=Math.max(0,state[k]+(+b.dataset.d)); saveLocal();render()
});
document.querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>hit(b.dataset.hit));

$("save").onclick=()=>{
 const item={date:new Date().toLocaleString("ja-JP"),...state};
 const h=JSON.parse(localStorage.getItem("jugglerHistory")||"[]");h.unshift(item);localStorage.setItem("jugglerHistory",JSON.stringify(h));renderHistory();toast("実戦を保存しました")
};
$("reset").onclick=()=>{
 if(!confirm("現在の実戦をリセットしますか？（保存済み履歴は残ります）"))return;
 Object.assign(state,{g:0,grape:0,cherry:0,big:0,reg:0,lastHitG:null,events:[]});saveLocal();render();toast("新しい実戦です")
};
function renderHistory(){
 const h=JSON.parse(localStorage.getItem("jugglerHistory")||"[]");
 $("history").innerHTML=h.length?h.map((x,i)=>`<div class="row"><span>${x.date}<br>${x.machine}　${x.g}G　BIG${x.big} REG${x.reg}</span><b>${rate(x.big+x.reg,x.g)}</b></div>`).join(""):"まだ履歴なし";
}
$("clear").onclick=()=>{if(confirm("保存履歴を全部削除しますか？")){localStorage.removeItem("jugglerHistory");renderHistory();toast("履歴を削除しました")}};
$("export").onclick=()=>{
 const h=localStorage.getItem("jugglerHistory")||"[]";
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"application/json"}));a.download="juggler-history.json";a.click()
};
const old=JSON.parse(localStorage.getItem("jugglerPro")||"null"); if(old)Object.assign(state,old);
$("machine").value=state.machine;render();renderHistory();
</script>
</body>
</html>
