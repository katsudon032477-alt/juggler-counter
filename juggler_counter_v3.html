<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ジャグラー実戦カウンター</title>
<style>
:root{--bg:#f3f6f9;--navy:#17324d;--blue:#2f75b5;--green:#70ad47;--red:#c55a5a;--orange:#e67e55;--gray:#8ba1b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
.wrap{max-width:540px;margin:auto;padding:10px 12px 30px}
h1{font-size:22px;margin:5px 0 10px}
.card{background:#fff;border-radius:18px;padding:13px;margin:9px 0;box-shadow:0 2px 10px #00000010}
.top{display:grid;grid-template-columns:1.15fr .85fr;gap:9px}
label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}
input,select{width:100%;border:1px solid #d5dce3;border-radius:11px;padding:11px;font-size:17px;background:#fff;color:var(--navy)}
.current{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigCurrent{font-size:30px;font-weight:900;text-align:center;background:#eef5fb;border-radius:12px;padding:10px}
.smallCurrent{font-size:18px;font-weight:800;text-align:center;background:#f7f8f9;border-radius:12px;padding:10px}
.counter{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:9px}
.num{text-align:center;font-size:43px;font-weight:900}
button{border:0;border-radius:15px;min-height:60px;font-size:30px;font-weight:900;color:#fff;touch-action:manipulation}
button:active{transform:scale(.94)}
.minus{background:var(--gray)}
.grape .plus{background:var(--green)}
.cherry .plus{background:var(--orange)}
.big .plus{background:var(--blue)}
.reg .plus{background:var(--red)}
.rateGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:#f6f8fa;border-radius:11px;padding:9px}
.stat b{display:block;font-size:11px;color:#6c7884}.stat span{font-size:18px;font-weight:900}
.save{width:100%;background:var(--navy);font-size:18px;margin-top:9px}
.secondary{width:100%;background:#8a9aa8;font-size:15px;min-height:45px;margin-top:7px}
.history{max-height:270px;overflow:auto}
.hit{display:grid;grid-template-columns:52px 1fr 65px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.badge{color:#fff;border-radius:9px;padding:5px;text-align:center;font-weight:900}
.badge.big{background:var(--blue)}.badge.reg{background:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{font-size:14px;min-height:45px;background:#6f8190}
.msg{text-align:center;min-height:20px;font-weight:800;margin-top:7px}
.note{font-size:11px;color:#73808c;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
<h1>🎰 ジャグラー実戦カウンター</h1>

<div class="card top">
<div><label>機種</label><select id="machine">
<option>ゴーゴージャグラー</option><option>マイジャグラー</option><option>ファンキージャグラー</option>
<option>ネオアイムジャグラー</option><option>ハッピージャグラー</option><option>ジャグラーガールズ</option>
</select></div>
<div><label>現在G</label><input id="games" type="number" min="0" inputmode="numeric" value="0"></div>
</div>

<div class="card current">
<div class="bigCurrent"><small>現在G</small><br><span id="gView">0</span>G</div>
<div class="smallCurrent"><small>当たり合計</small><br><span id="hitView">0</span>回</div>
</div>

<div class="card grape">
<label>🍇 ぶどう</label>
<div class="counter"><button class="minus" onclick="add('grape',-1)">−</button><div class="num" id="grape">0</div><button class="plus" onclick="add('grape',1)">＋</button></div>
</div>

<div class="card cherry">
<label>🍒 チェリー</label>
<div class="counter"><button class="minus" onclick="add('cherry',-1)">−</button><div class="num" id="cherry">0</div><button class="plus" onclick="add('cherry',1)">＋</button></div>
</div>

<div class="card big">
<label>🔵 BIG — 押すと現在Gを記録</label>
<div class="counter"><button class="minus" onclick="add('big',-1)">−</button><div class="num" id="big">0</div><button class="plus" onclick="hit('BIG')">＋</button></div>
</div>

<div class="card reg">
<label>🔴 REG — 押すと現在Gを記録</label>
<div class="counter"><button class="minus" onclick="add('reg',-1)">−</button><div class="num" id="reg">0</div><button class="plus" onclick="hit('REG')">＋</button></div>
</div>

<div class="card">
<div class="rateGrid">
<div class="stat"><b>合算</b><span id="combined">—</span></div>
<div class="stat"><b>BIG確率</b><span id="bigRate">—</span></div>
<div class="stat"><b>REG確率</b><span id="regRate">—</span></div>
<div class="stat"><b>🍇 ぶどう</b><span id="grapeRate">—</span></div>
<div class="stat"><b>🍒 チェリー</b><span id="cherryRate">—</span></div>
<div class="stat"><b>当たり間隔</b><span id="lastGap">—</span></div>
</div>
</div>

<div class="card">
<label>当たり履歴（現在Gを自動記録）</label>
<div id="history" class="history"></div>
</div>

<div class="card">
<button class="save" onclick="saveCSV()">💾 実戦データを保存</button>
<div class="actions">
<button onclick="undoHit()">↩️ 直前の当たり取消</button>
<button onclick="resetAll()">🗑️ 実戦リセット</button>
</div>
<div id="msg" class="msg"></div>
</div>

<div class="card note">
🍇🍒は出現したら「＋」。BIG/REGは当たった瞬間に「＋」。<br>
BIG/REGは押した時点の現在Gを自動記録します。<br>
途中データは端末内に自動保存されるので、画面を閉じても残ります。
</div>
</div>

<script>
const KEY='juggler_v3';
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{
 machine:'ゴーゴージャグラー',games:0,big:0,reg:0,grape:0,cherry:0,hits:[]
};
const $=id=>document.getElementById(id);

function persist(){localStorage.setItem(KEY,JSON.stringify(s))}
function add(k,n){s[k]=Math.max(0,(s[k]||0)+n);persist();render()}
$('games').addEventListener('input',e=>{s.games=Math.max(0,Number(e.target.value)||0);persist();render()});
$('machine').addEventListener('change',e=>{s.machine=e.target.value;persist()});

function hit(type){
 const g=s.games;
 s[type==='BIG'?'big':'reg']++;
 s.hits.push({type,g,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
 persist();render();
}
function undoHit(){
 if(!s.hits.length)return;
 const h=s.hits.pop();
 if(h.type==='BIG')s.big=Math.max(0,s.big-1);else s.reg=Math.max(0,s.reg-1);
 persist();render();
}
function rate(n){return s.games&&n?'1/'+(s.games/n).toFixed(2):'—'}
function render(){
 $('machine').value=s.machine;
 $('games').value=s.games;
 $('gView').textContent=s.games;
 $('big').textContent=s.big;$('reg').textContent=s.reg;
 $('grape').textContent=s.grape;$('cherry').textContent=s.cherry;
 $('hitView').textContent=s.big+s.reg;
 $('combined').textContent=s.games&&(s.big+s.reg)?'1/'+(s.games/(s.big+s.reg)).toFixed(1):'—';
 $('bigRate').textContent=rate(s.big);$('regRate').textContent=rate(s.reg);
 $('grapeRate').textContent=rate(s.grape);$('cherryRate').textContent=rate(s.cherry);
 const h=s.hits; const last=h.length?h[h.length-1].g:null;
 $('lastGap').textContent=h.length>=2?(last-h[h.length-2].g)+'G':'—';
 $('history').innerHTML=h.slice().reverse().map((x,i)=>
 `<div class="hit"><span class="badge ${x.type==='BIG'?'big':'reg'}">${x.type}</span><b>${x.g}G</b><span>${x.time}</span></div>`
 ).join('') || '<div class="note">まだ当たり履歴なし</div>';
}
function saveCSV(){
 if(!s.games){msg('総回転を入れてね');return}
 const rows=[
 ['日付',new Date().toLocaleDateString('ja-JP'),'機種',s.machine],
 ['総回転',s.games,'BIG',s.big,'REG',s.reg,'ぶどう',s.grape,'チェリー',s.cherry],
 ['合算',s.games/(s.big+s.reg||1),'BIG確率',s.games/(s.big||1),'REG確率',s.games/(s.reg||1),'ぶどう確率',s.games/(s.grape||1),'チェリー確率',s.games/(s.cherry||1)],
 [],
 ['当たり種別','現在G','時刻'],
 ...s.hits.map(x=>[x.type,x.g,x.time])
 ];
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='juggler_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
 msg('CSVを保存したよ');
}
function resetAll(){
 if(confirm('この実戦のカウンターを全部リセットしますか？')){
  s={machine:s.machine,games:0,big:0,reg:0,grape:0,cherry:0,hits:[]};persist();render();msg('');
 }
}
function msg(t){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent===t)$('msg').textContent=''},2200)}
render();
</script>
</body>
</html>
